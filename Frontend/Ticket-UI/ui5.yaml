specVersion: "4.0"
metadata:
  name: ticket-ui
type: application

framework:
  name: SAPUI5
  version: "1.142.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon

server:
  customMiddleware:
  - name: ui5-middleware-simpleproxy
    beforeMiddleware: serveResources        
    configuration:
      baseUri: "https://localhost:7187/"
      mountPath: "/check"
      debug: true
      ignoreCertError: true
      changeOrigin: true
      logLevel: "debug"
      headers:
        Access-Control-Allow-Origin: "*"
        Access-Control-Allow-Methods: "GET, POST, PUT"
        Access-Control-Allow-Headers: "Content-Type, Authorization"
  - name: fiori-tools-appreload
    afterMiddleware: compression
    configuration:
      port: 35729
      path: webapp
      delay: 300