specVersion: "4.0"
metadata:
  name: ui5.ticketui
type: application
framework:
  name: OpenUI5
  version: "1.142.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon
server:
  customMiddleware:
  - name: ui5-middleware-simpleproxy
    afterMiddleware: compression
    mountPath: /V2
    configuration:
      baseUri: "https://localhost:7187/api"
