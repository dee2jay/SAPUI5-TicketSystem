services:
  api:
    build:
      context: .
      dockerfile: TicketSystem.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=TicketSystemDB;User Id=sa;Password=\${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      ConnectionStrings__MongoDB: "mongodb://mongodb:27017"
      MongoSettings__Database: "mongodb://mongodb:27017/LoggingDB"
      Jwt__SecretKey: "\${JWT_SECRET_KEY}"
      Jwt__Issuer: "\${JWT_ISSUER:-TicketManagementAPI}"
      Jwt__Audience: "\${JWT_AUDIENCE:-TicketManagementAPI}"
      Jwt__ExpirationInMinutes: "\${JWT_EXPIRATION_MINUTES:-60}"
      Jwt__RefreshTokenExpirationInDays: "\${JWT_REFRESH_EXPIRATION_DAYS:-30}"
      Cors__AllowedOrigins: "\${CORS_ALLOWED_ORIGINS:-http://localhost:8081}"
      SmtpSettings__Host: "\${SMTP_HOST:-}"
      SmtpSettings__Port: "\${SMTP_PORT:-}"
      SmtpSettings__From: "\${SMTP_FROM:-}"
      SmtpSettings__Username: "\${SMTP_USERNAME:-}"
      SmtpSettings__Password: "\${SMTP_PASSWORD:-}"
      SmtpSettings__EnableSsl: "\${SMTP_ENABLE_SSL:-true}"
    depends_on:
      sqlserver:
        condition: service_healthy
      mongodb:
        condition: service_started
    expose:
      - "8080"
    volumes:
      - ticket_attachments:/app/data/attachments
    networks:
      - ticketsystem

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: "\${SQLSERVER_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"\${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - ticketsystem

  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    expose:
      - "27017"
    networks:
      - ticketsystem

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ticketsystem

volumes:
  sqlserver_data:
  mongodb_data:
  ticket_attachments:

networks:
  ticketsystem:
    driver: bridge
